[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "defense"
version = "0.1.0"
description = "Smart Layer — social-media analysis pipeline (ingest → NLP → router → LLM → assembler)"
requires-python = ">=3.11"

# Core runtime — everything needed for the default, verified stub-mode run
# (Mode A in run.md): API + 5 workers + assembler + agents + MCP servers.
# No GPU / ML weights required. See run.md §1.
dependencies = [
    "fastapi>=0.115.0",
    "starlette>=0.40,<0.51",                      # FastAPI 0.128 needs starlette<0.51
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.0",
    "redis[hiredis]>=5.2.0",
    "clickhouse-driver>=0.2.9",
    "boto3>=1.35.0",
    "jsonschema>=4.23.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.0.0",
    "tenacity>=9.0.0",
    "openai>=1.58.0",
    "pytest>=8.3.2",
    "pytest-asyncio>=0.23.8",
    "testcontainers[postgres,redis]>=4.8.0",
    "httpx>=0.28.0",
    "numpy>=2.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.12",
    "prometheus-fastapi-instrumentator>=7.0.0,<8",  # 8.x pulls an incompatible starlette
    "fastmcp>=3.4.0",
    "pgvector>=0.5.0",
    "msgpack>=1.2.1",
    "torch>=2.5.0",
    "transformers>=4.47.0",
    "emoji>=2.15.0",
    "reportlab>=5.0.0",
    "weasyprint>=69.0",
    "psutil>=7.2.2",
]

[project.optional-dependencies]
# Real EMBEDDINGS only — the retrieval half of `ml`.
#
# Separate because it is independently useful: clustering (get_clusters, and the
# per-cluster LLM summaries reports.py calls the cost lever) has no lexical
# fallback the way search does, so hash vectors make it group posts at random.
# Hybrid retrieval fixed search without real embeddings; nothing fixes clustering
# without them. This extra buys that without loading CLIP, NER, KeyBERT and the
# emotion/toxicity pipelines onto a GPU that is usually already hosting the LLM.
#
# Pairs with EMBEDDING_STUB_MODE=false, which turns on real embeddings WITHOUT
# turning on the rest of the Stage-1 model suite the way MODEL_STUB_MODE does.
# Install with: uv sync --extra embeddings
embeddings = [
    "sentence-transformers>=3.0.0",
]
# Real NLP/vision models — only needed with MODEL_STUB_MODE=false (needs a GPU
# for reasonable throughput). Install with: uv sync --extra ml
#
# Requires Python <= 3.12, which is why .python-version pins 3.12: fasttext-wheel
# 0.9.2 publishes no cp313 wheel and its bundled C++ no longer compiles (`args.cc`
# fails on an out-of-scope declaration), so on 3.13 this extra cannot be built at
# all. Nothing else here is version-constrained.
ml = [
    "sentence-transformers>=3.0.0",
    "fasttext-wheel>=0.9.2",
    "keybert>=0.8.0",
    "scikit-learn>=1.6.0",
    "Pillow>=11.0.0",
]
# Test + lint tooling. Install with: uv sync --extra dev
dev = [
    "pytest>=8.0.0",
    # tests/test_stage1_llm_sentiment.py uses @pytest.mark.asyncio; without this
    # plugin those tests error out rather than skip.
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]
# OpenTelemetry tracing (§10) — only needed with OTEL_ENABLED=true. Install with:
# uv sync --extra obs. Exports spans via OTLP to the compose Jaeger/collector.
obs = [
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
]
# Kafka bus backend (prod) — only needed with BUS_BACKEND=kafka. Install with:
# uv sync --extra kafka. Redis Streams (the default MVP bus) needs nothing extra.
kafka = [
    "aiokafka>=0.11.0",
]

[tool.uv]
# Manage dependencies and build as a standard package.
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# The tree moved under src/defense/, but the workers still use bare imports
# (`from libs.… import`, `from services.… import`) because each one is launched
# with its own package root. Tests import both spellings — `defense.x` for the
# installed package and the bare `libs.x` / `services.x` the workers themselves
# use — so both roots have to be importable or a whole class of contract test
# silently stops collecting.
pythonpath = [".", "src", "src/defense"]
markers = [
    "e2e: needs a full Docker + Ollama stack, not just the venv.",
    # Wipes datastores. Skipped unless RUN_DESTRUCTIVE_E2E=1 — a bare `pytest`
    # must never be able to destroy the developer's live dev environment.
    "destructive: mutates or wipes live datastores; opt-in only.",
]

[tool.ruff]
line-length = 100
target-version = "py311"

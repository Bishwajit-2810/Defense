# Workers: ingestion, router, stage2_llm, assembler
# These are Redis stream consumers — no HTTP ports exposed.
# Replica count is intentionally 1; KEDA ScaledObjects handle autoscaling based on stream lag.

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion
  namespace: defense
  labels:
    app: ingestion
    app.kubernetes.io/part-of: defense
    role: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ingestion
  template:
    metadata:
      labels:
        app: ingestion
        app.kubernetes.io/part-of: defense
        role: worker
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: ingestion
          image: defense/ingestion:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: defense-config
            - secretRef:
                name: defense-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL


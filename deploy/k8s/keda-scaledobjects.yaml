# KEDA ScaledObjects — one per Redis stream consumer worker.
# Prerequisites: KEDA operator installed in the cluster (https://keda.sh/docs/deploy/).
# Each ScaledObject scales its target Deployment based on the consumer group's
# LAG in the corresponding Redis stream. When the stream is drained the
# deployment can scale down to 0 replicas, saving resources.
#
# Two things here were wrong and each failed silently (PROJECT_ASSESSMENT §5.5):
#
#   1. `consumerGroup` (and, for two scalers, `stream`) named groups no worker
#      ever creates — `router-group` vs the real `router-workers`,
#      `stage2_llm:queue` vs the real `llm:stage2:queue`. A redis-streams
#      trigger pointed at a nonexistent group reports NO BACKLOG, so ingestion,
#      the router and Stage 2 — the only stage where scaling changes cost or
#      latency — never scaled, while these manifests looked correct.
#      The names now come from libs/streams.py and tests/test_streams.py
#      asserts this file agrees with it.
#
#   2. `pendingEntriesCount` cannot scale from zero. Pending entries are
#      messages DELIVERED to a consumer and not yet ACKed; with
#      `minReplicaCount: 0` there is no consumer, so nothing is ever delivered,
#      the pending count stays 0, and KEDA never wakes the deployment. Scaling
#      from zero on Redis Streams needs `lagCount` (stream length vs the
#      group's last-delivered id), which is what every trigger below uses.

---
# ── ingestion ─────────────────────────────────────────────────────────────────
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: ingestion-scaler
  namespace: defense
  labels:
    app: ingestion
    app.kubernetes.io/part-of: defense
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ingestion
  pollingInterval: 15       # seconds between lag checks
  cooldownPeriod: 60        # seconds to wait before scaling down
  minReplicaCount: 0
  maxReplicaCount: 5
  triggers:
    - type: redis-streams
      metadata:
        address: redis.defense.svc.cluster.local:6379
        stream: ingestion:queue
        consumerGroup: ingestion-workers
        lagCount: "10"

---
# ── worker-router ─────────────────────────────────────────────────────────────
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: worker-router-scaler
  namespace: defense
  labels:
    app: worker-router
    app.kubernetes.io/part-of: defense
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: worker-router
  pollingInterval: 15
  cooldownPeriod: 60
  minReplicaCount: 0
  maxReplicaCount: 5
  triggers:
    - type: redis-streams
      metadata:
        address: redis.defense.svc.cluster.local:6379
        stream: router:queue
        consumerGroup: router-workers
        lagCount: "10"

---
# ── worker-stage1-nlp ─────────────────────────────────────────────────────────
# maxReplicaCount is capped at 3 to respect finite GPU node availability.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: worker-stage1-nlp-scaler
  namespace: defense
  labels:
    app: worker-stage1-nlp
    app.kubernetes.io/part-of: defense
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: worker-stage1-nlp
  pollingInterval: 15
  cooldownPeriod: 120       # longer cooldown — GPU pods are expensive to restart
  minReplicaCount: 0
  maxReplicaCount: 3
  triggers:
    - type: redis-streams
      metadata:
        address: redis.defense.svc.cluster.local:6379
        stream: nlp:stage1:queue
        consumerGroup: stage1-nlp-group
        lagCount: "10"

---
# ── worker-stage2-llm ─────────────────────────────────────────────────────────
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: worker-stage2-llm-scaler
  namespace: defense
  labels:
    app: worker-stage2-llm
    app.kubernetes.io/part-of: defense
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: worker-stage2-llm
  pollingInterval: 15
  cooldownPeriod: 60
  minReplicaCount: 0
  maxReplicaCount: 5
  triggers:
    - type: redis-streams
      metadata:
        address: redis.defense.svc.cluster.local:6379
        stream: llm:stage2:queue
        consumerGroup: stage2-llm-workers
        lagCount: "10"

---
# ── worker-assembler ──────────────────────────────────────────────────────────
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: worker-assembler-scaler
  namespace: defense
  labels:
    app: worker-assembler
    app.kubernetes.io/part-of: defense
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: worker-assembler
  pollingInterval: 15
  cooldownPeriod: 60
  minReplicaCount: 0
  maxReplicaCount: 5
  triggers:
    - type: redis-streams
      metadata:
        address: redis.defense.svc.cluster.local:6379
        stream: assembler:queue
        consumerGroup: assembler-group
        lagCount: "10"

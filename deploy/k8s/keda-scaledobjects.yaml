# KEDA ScaledObjects — one per Redis stream consumer worker.
# Prerequisites: KEDA operator installed in the cluster (https://keda.sh/docs/deploy/).
# Each ScaledObject scales its target Deployment based on pendingEntriesCount in the
# corresponding Redis stream consumer group. When the stream is empty (lag == 0) the
# deployment can scale down to 0 replicas, saving resources.

---
# ── ingestion ─────────────────────────────────────────────────────────────────
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: ingestion-scaler
  namespace: defense
  labels:
    app: ingestion
    app.kubernetes.io/part-of: defense
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ingestion
  pollingInterval: 15       # seconds between lag checks
  cooldownPeriod: 60        # seconds to wait before scaling down
  minReplicaCount: 0
  maxReplicaCount: 5
  triggers:
    - type: redis-streams
      metadata:
        address: redis.defense.svc.cluster.local:6379
        stream: ingestion:queue
        consumerGroup: ingestion-group
        pendingEntriesCount: "10"

---
